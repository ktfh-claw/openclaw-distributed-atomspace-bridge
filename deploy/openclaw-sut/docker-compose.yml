# docker-compose.yml — OpenClaw-SUT gateway (spec R-D4).
#
# Gateway service from the wrapper image built by deploy.sh stage 2
# (openclaw-sut:2026.10.10-metta1), container name openclaw-sut-gateway,
# the seeded named volume -> /var/openclaw/workspace, the state volume
# (onboarded config, sessions) -> /var/openclaw/state, env_file runtime.env
# (generated by deploy.sh stage 4 — never committed), the ONLY published
# port is the localhost-bound gateway port 18789 (Control UI/token stays
# local), restart: unless-stopped. The profile-gated `cli` service mirrors
# the official image pattern for `docker compose run` CLI work
# (pre-start CLI runs use the gateway service with --entrypoint node —
# see deploy.sh sut_cli; the cli service shares the gateway network
# namespace and only works once the gateway container exists).
#
# The omega-das-integration-client network attachment is added by
# deploy.sh stage 7 and re-established after every compose down/up by
# openclaw-sut.service's ExecStartPost (the harness restart path recreates
# the container, and a fresh container joins only this compose network).
services:
  gateway:
    image: openclaw-sut:2026.10.10-metta1
    container_name: openclaw-sut-gateway
    env_file: runtime.env
    volumes:
      - openclaw-sut-workspace:/var/openclaw/workspace
      - openclaw-sut-state:/var/openclaw/state
      - ./sut-config-overlay.json:/var/openclaw/sut-config-overlay.json:ro
    ports:
      - "127.0.0.1:18789:18789"
    restart: unless-stopped

  cli:
    image: openclaw-sut:2026.10.10-metta1
    profiles: ["cli"]
    network_mode: "service:gateway"
    env_file: runtime.env
    volumes:
      - openclaw-sut-workspace:/var/openclaw/workspace
      - openclaw-sut-state:/var/openclaw/state
    restart: "no"

volumes:
  # created + seeded by deploy.sh stage 3 (workspace-seed/ + skills-sut/);
  # external so compose never creates an unseeded one behind the deploy flow
  openclaw-sut-workspace:
    name: openclaw-sut-workspace
    external: true
  # onboarded config + sessions; created by compose on first use; plain
  # `docker compose down` keeps named volumes (only `down -v` removes them)
  openclaw-sut-state:
    name: openclaw-sut-state
